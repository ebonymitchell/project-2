# Configure the Vite development server for Netlify.
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# Tell Netlify where to find our serverless functions.
[functions]
  directory = "netlify/functions"

# Tell Netlify where Vite places production builds.
[build]
  command = "npm run build"
  publish = "dist"
